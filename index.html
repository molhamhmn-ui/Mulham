<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0064A8">
<title>NFE Protection Monitoring</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--b:#0064A8;--o:#EE8A18;--bg:#f3f6fa;--c:#fff;--t:#1d2733;--m:#5b6776;--l:#dbe3ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans Arabic","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px;font-size:16px}
header{background:linear-gradient(180deg,#fff,#f7fafd);border-bottom:3px solid var(--o);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{height:42px}header .bd{color:var(--b);flex:none}header b{color:var(--b);font-size:14.5px;line-height:1.25}
main{padding:14px;max-width:640px;margin:auto}.scr{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0a2a4a0d}
h2{color:var(--b);margin:0 0 8px;font-size:19px}h3{margin:0 0 4px;font-size:16px}.sm{color:var(--m);font-size:13px}
.i{vertical-align:middle;flex:none}
button,.btn{font:inherit;min-height:52px;border-radius:14px;border:2px solid var(--b);background:#fff;color:var(--b);padding:8px 14px;width:100%;margin:5px 0;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
button:active{transform:scale(.97)}button.p{background:var(--b);color:#fff}button.o{background:var(--o);border-color:var(--o);color:#fff}button.d{border-color:#c62828;color:#c62828}
button.s{width:auto;min-height:42px;display:inline-flex;margin:3px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
input,textarea,select{font:inherit;width:100%;padding:11px;border:1.5px solid var(--l);border-radius:12px;background:#fff;color:var(--t)}input:focus,textarea:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 3px #0064a822}
textarea{min-height:84px}label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;font-weight:500}.chk input{width:22px;height:22px}
.sec{display:flex;gap:10px;align-items:center;direction:ltr;text-align:left}.sec .ic{background:#e6f0f9;color:var(--b);border-radius:12px;padding:8px;display:flex}.sec b{font-size:14.5px}
.q{direction:ltr;text-align:left;font-size:18px;line-height:1.5;font-weight:600;margin:10px 0 6px}.qa{direction:rtl;text-align:right;font-size:15px;line-height:1.6;color:#4a5a6c;background:#f5f8fb;border-radius:10px;padding:8px 10px;margin:0 0 12px}
.ar{direction:rtl;text-align:right;font-size:12.5px;color:var(--m);font-weight:500}
.link{direction:ltr;text-align:left;font-size:12.5px;color:var(--m);font-style:italic;margin-top:6px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ans button{margin:0;min-height:58px;direction:ltr}
.ans .Y{border-color:#1b8a4b;color:#1b8a4b}.ans .N{border-color:#c62828;color:#c62828}.ans .P{border-color:#b98200;color:#8a6100}.ans .NA{border-color:#6b7280;color:#4b5563}
.ans .Y.on{background:#1b8a4b;color:#fff}.ans .N.on{background:#c62828;color:#fff}.ans .P.on{background:#f2b01e;color:#3a2a00}.ans .NA.on{background:#6b7280;color:#fff}
.c-Y{border-inline-start:5px solid #1b8a4b}.c-N{border-inline-start:5px solid #c62828}.c-P{border-inline-start:5px solid #f2b01e}.c-NA{border-inline-start:5px solid #6b7280}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--o));transition:width .3s}
.warn{background:#fff6e5;border:1px solid var(--o);border-radius:12px;padding:10px;font-size:13.5px;margin:8px 0}
.hero{background:linear-gradient(135deg,#0064A8,#1a7fc4);color:#fff;border:0}.hero h2{color:#fff}.hero button.p{background:#fff;color:var(--b);border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:24px;color:var(--b)}.stats span{font-size:12px;color:var(--m)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:#e6f0f9;color:var(--b);font-weight:600}.chip.dr{background:#fff1dc;color:#9a5b00}
.fl button{width:auto;min-height:38px;display:inline-flex;margin:2px;padding:4px 12px;font-size:13.5px;border-width:1.5px}.fl button.on{background:var(--b);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;z-index:6;padding-bottom:4px}
nav a{flex:1;text-align:center;padding:7px 2px;font-size:11.5px;color:var(--m);font-weight:600;text-decoration:none}nav a .pl{display:inline-flex;padding:4px 16px;border-radius:16px;transition:background .2s}nav a.on{color:var(--b)}nav a.on .pl{background:#dcebf8}nav a span{display:block}
.tot{font-weight:700;color:var(--b)}
#mod{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}#mod>div{background:#fff;border-radius:18px;padding:18px;max-width:420px;width:100%;animation:fi .2s}
</style></head><body>

ity."}, {"n": 6, "t": "Feedback, Complaints and Accountability to Affected People", "l": "Protection mainstreaming link: Accountability; participation; meaningful access."}, {"n": 7, "t": "Participation of Children, Caregivers and Community", "l": "Protection mainstreaming link: Participation and empowerment; accountability."}],ITEMS=[{"s": 0, "n": 1, "q": "1. The route to the school is generally safe for children, caregivers and staff, with no visible security or harassment risks at the time of visit."}, {"s": 0, "n": 2, "q": "2. Access arrangements are equally feasible for girls, boys, children with disabilities, and children from different social groups or displacement backgrounds."}, {"s": 0, "n": 3, "q": "3. Arrival and dismissal times reduce crowding and exposure to protection risks outside the school gate."}, {"s": 0, "n": 4, "q": "4. Any access barriers reported by children/caregivers are documented and escalated through the correct programme channel."}, {"s": 1, "n": 1, "q": "1. The school yard, stairs, corridors, classroom doors, windows and handrails do not present obvious injury risks."}, {"s": 1, "n": 2, "q": "2. Classrooms and learning spaces are adequately lit, ventilated, not overcrowded, and allow safe movement."}, {"s": 1, "n": 3, "q": "3. The school has a basic first-aid arrangement and staff know how to respond to minor injuries and urgent incidents."}, {"s": 1, "n": 4, "q": "4. The overall environment protects children’s dignity and does not expose them to public shaming, punishment or degrading treatment."}, {"s": 2, "n": 1, "q": "1. There are separate toilets for girls and boys, clearly identifiable and safely accessible."}, {"s": 2, "n": 2, "q": "2. Toilets provide privacy from outside view, have functional doors/locks where appropriate, and are not located in isolated unsafe areas."}, {"s": 2, "n": 3, "q": "3. Toilets are clean, usable, and have water and soap or an alternative handwashing arrangement."}, {"s": 2, "n": 4, "q": "4. Children with physical, visual, hearing or intellectual disabilities can use at least one toilet with dignity and safety."}, {"s": 3, "n": 1, "q": "1. The school entrance, classroom route, toilets and learning space are accessible or have safe alternative arrangements for children with disabilities."}, {"s": 3, "n": 2, "q": "2. Children with disabilities participate in the same learning activities as peers whenever possible, with adaptations as needed."}, {"s": 3, "n": 3, "q": "3. No child is excluded from enrolment, attendance, activities or distribution because of disability, impairment, assistive device, health condition or caregiver concerns."}, {"s": 3, "n": 4, "q": "4. Staff know how to refer children with disabilities or caregivers to available specialized services when needs exceed the school’s capacity."}, {"s": 4, "n": 1, "q": "1. Teachers, facilitators, volunteers and school staff involved in the activity have been oriented on child safeguarding and PSEA responsibilities."}, {"s": 4, "n": 2, "q": "2. Staff understand prohibited behaviors, including physical punishment, sexual exploitation/abuse, harassment, favoritism, gifts in exchange for services, and private unsupervised contact."}, {"s": 4, "n": 3, "q": "3. Children and caregivers know that services are free and that no one may request money, favors, gifts, work, or personal relationships for assistance."}, {"s": 4, "n": 4, "q": "4. Staff know how to report safeguarding or SEA concerns safely and confidentially, including urgent escalation channels."}, {"s": 5, "n": 1, "q": "1. Children and caregivers know how to submit feedback or complaints through at least one safe and accessible channel."}, {"s": 5, "n": 2, "q": "2. Complaints channels are child-friendly, confidential, and available for girls, boys, children with disabilities and caregivers with low literacy."}, {"s": 5, "n": 3, "q": "3. There is a safe pathway for sensitive complaints, including safeguarding/PSEA concerns, separate from general feedback."}, {"s": 5, "n": 4, "q": "4. Children and caregivers are not discouraged from complaining, and no one is threatened, blamed or punished for giving feedback."}, {"s": 6, "n": 1, "q": "1. Girls, boys, children with disabilities and marginalized children have opportunities to express priorities and barriers."}, {"s": 6, "n": 2, "q": "2. Caregivers receive clear information on the NFE schedule, objectives, attendance expectations, safeguarding rules and available support."}, {"s": 6, "n": 3, "q": "3. Children are not photographed, filmed or quoted without appropriate informed consent/assent and dignity safeguards."}, {"s": 6, "n": 4, "q": "4. There is evidence that children/caregivers’ input informs practical decisions such as timing, access, classroom arrangements or referral support."}],AR={"s": ["الوصول الآمن والهادف إلى المدرسة", "سلامة وكرامة محيط المدرسة", "المياه والصرف الصحي (WASH) والمراحيض والنظافة الشهرية", "إدماج ذوي الإعاقة والتيسيرات المعقولة", "حماية الطفل والحماية من الاستغلال والانتهاك الجنسيين (PSEA) وسلوك الكادر", "الملاحظات والشكاوى والمساءلة أمام المتأثرين", "مشاركة الأطفال ومقدّمي الرعاية والمجتمع"], "q": ["الطريق إلى المدرسة آمن عموماً للأطفال ومقدّمي الرعاية والكادر، ولا توجد مخاطر أمنية أو تحرّش ظاهرة وقت الزيارة.", "ترتيبات الوصول متاحة بالتساوي للبنات والأولاد والأطفال ذوي الإعاقة والأطفال من مختلف الفئات الاجتماعية أو خلفيات النزوح.", "أوقات الوصول والانصراف تقلّل الازدحام والتعرّض لمخاطر الحماية خارج بوابة المدرسة.", "أي عوائق وصول يبلّغ عنها الأطفال/مقدّمو الرعاية تُوثَّق وتُرفع عبر قناة البرنامج الصحيحة.", "ساحة المدرسة والدرج والممرات وأبواب الصفوف والنوافذ والدرابزين لا تشكّل مخاطر إصابة واضحة.", "الصفوف ومساحات التعلّم مضاءة ومهوّاة بشكل كافٍ، وغير مكتظة، وتسمح بالحركة الآمنة.", "لدى المدرسة ترتيبات إسعاف أولي أساسية، ويعرف الكادر كيف يتعامل مع الإصابات البسيطة والحوادث الطارئة.", "البيئة العامة تحفظ كرامة الأطفال ولا تعرّضهم للتشهير العلني أو العقاب أو المعاملة المهينة.", "توجد مراحيض منفصلة للبنات والأولاد، واضحة التمييز ويمكن الوصول
